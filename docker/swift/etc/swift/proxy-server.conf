[DEFAULT]
bind_ip = 0.0.0.0
bind_port = 8080
workers = 1
user = swift
swift_dir = /etc/swift
log_name = proxy-server
log_facility = LOG_LOCAL0
log_level = INFO
log_address = /dev/log
access_log_name = proxy-server
access_log_facility = LOG_LOCAL0
access_log_level = INFO

# s3api MUST be before the auth middleware. bulk and slo are required for
# S3 multi-object delete and multipart upload support.
[pipeline:main]
pipeline = catch_errors gatekeeper healthcheck proxy-logging cache listing_formats s3api tempauth bulk slo dlo versioned_writes symlink proxy-server

[app:proxy-server]
use = egg:swift#proxy
allow_account_management = true
account_autocreate = true

[filter:catch_errors]
use = egg:swift#catch_errors

[filter:gatekeeper]
use = egg:swift#gatekeeper

[filter:healthcheck]
use = egg:swift#healthcheck

[filter:proxy-logging]
use = egg:swift#proxy_logging

[filter:cache]
use = egg:swift#memcache
memcache_servers = 127.0.0.1:11211

[filter:listing_formats]
use = egg:swift#listing_formats

# Upstream S3 API middleware (the successor of the standalone swift3 project).
[filter:s3api]
use = egg:swift#s3api
s3_acl = true
allow_multipart_uploads = true
min_segment_size = 5242880
max_upload_part_num = 10000
location = us-east-1
dns_compliant_bucket_names = true

# S3 credentials:
#   access key = test:tester
#   secret key = testing
# The access key is "<account>:<user>" for tempauth, exactly like swift3.
[filter:tempauth]
use = egg:swift#tempauth
user_test_tester = testing .admin
user_admin_admin = admin .admin .reseller_admin

[filter:bulk]
use = egg:swift#bulk

[filter:slo]
use = egg:swift#slo

[filter:dlo]
use = egg:swift#dlo
rate_limit_after_segment = 10
rate_limit_segments_per_sec = 5

[filter:versioned_writes]
use = egg:swift#versioned_writes

[filter:symlink]
use = egg:swift#symlink
