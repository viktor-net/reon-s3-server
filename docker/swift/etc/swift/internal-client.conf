[DEFAULT]
swift_dir = /etc/swift
user = swift
log_name = internal-client
log_facility = LOG_LOCAL0
log_level = INFO
log_address = /dev/log

# Internal client used by the container sharder/sync. It talks directly to
# the proxy app without authentication, so no auth middleware is needed here.
[pipeline:main]
pipeline = catch_errors proxy-logging proxy-server

[app:proxy-server]
use = egg:swift#proxy
allow_account_management = true
account_autocreate = true

[filter:catch_errors]
use = egg:swift#catch_errors

[filter:proxy-logging]
use = egg:swift#proxy_logging
