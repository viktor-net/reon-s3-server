types {
    text/plain yaml;
    text/plain yml;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Swagger UI reads ./openapi.yaml. Rewrite the server URL on the fly so
    # browser requests go to /api/ on the same origin and CORS is not needed.
    location = /openapi.yaml {
        alias /spec/openapi.yaml;
        default_type application/yaml;
        sub_filter 'http://localhost:8080' '/api';
        sub_filter_once off;
        sub_filter_types application/yaml text/yaml text/plain;
        add_header Cache-Control "no-store";
    }

    # Same-origin proxy to the OpenStack Swift container.
    location = /api {
        proxy_pass http://swift:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:8080;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://swift:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host:8080;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /swagger-signer.js {
        alias /spec/swagger-signer.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    # Swagger UI controls for the dev-only S3 signer. The real state is kept
    # in the browser's localStorage; these endpoints only return JSON.
    location = /dev/s3-signing/login {
        limit_except POST { deny all; }
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"signing":"enabled","message":"S3 request signing enabled"}';
    }

    location = /dev/s3-signing/logout {
        limit_except POST { deny all; }
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"signing":"disabled","message":"S3 request signing disabled"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        # The HTML is rewritten below; never let a browser cache an old copy
        # that still lacks the signer <script> tag.
        add_header Cache-Control "no-store";
        sub_filter '<script src="./swagger-initializer.js"' '<script src="/swagger-signer.js"></script><script src="./swagger-initializer.js"';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
