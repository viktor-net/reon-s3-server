# Базовая инфраструктура для локальной разработки и отладки API на хосте:
#   docker compose up -d
#
# Прод-подобный запуск API в контейнере — отдельный профиль api:
#   docker compose -f docker-compose.yml -f docker-compose.api.yml \
#     --profile api up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: reon-s3-postgres
    restart: unless-stopped
    environment:
      # Значения по умолчанию — для локального стенда. Для контейнера API
      # те же переменные читает профиль api из docker-compose.api.yml.
      POSTGRES_DB: ${POSTGRES_DB:-reon}
      POSTGRES_USER: ${POSTGRES_USER:-reon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reon_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - reon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reon} -d ${POSTGRES_DB:-reon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-совместимое хранилище. Образ собирается в reon-s3-dev:
  #   cd ../reon-s3-dev && docker compose build swift
  # Здесь только запуск: Dockerfile, конфиги и smoke-тесты Swift остаются там.
  # Наружу опубликован порт 8080, локальный API ходит на localhost:8080.
  swift:
    image: ${SWIFT_IMAGE:-swift-s3api-aio:2.33}
    container_name: reon-s3-swift
    hostname: swift
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - swift-data:/srv/node
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Swagger UI для S3/Swift API: http://localhost:8081.
  # Nginx, подпись запросов и openapi.yaml лежат в docker/swagger/.
  docs:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: reon-s3-docs
    restart: unless-stopped
    depends_on:
      swift:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      DOC_EXPANSION: list
      DEEP_LINKING: "true"
      PERSIST_AUTHORIZATION: "true"
      TRY_IT_OUT_ENABLED: "true"
      VALIDATOR_URL: ""
    volumes:
      - ./docker/swagger/openapi.yaml:/spec/openapi.yaml:ro
      - ./docker/swagger/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/swagger/swagger-signer.js:/spec/swagger-signer.js:ro

  # Веб-менеджер файлов поверх S3: http://localhost:8082 (admin / admin).
  # Seed-конфиг копируется в volume filestash-state при первом старте,
  # дальше изменения из /admin живут в этом volume.
  filestash-init:
    image: busybox:1.37.0
    container_name: reon-s3-filestash-init
    restart: "no"
    volumes:
      - filestash-state:/state
      - ./docker/filestash/config.json:/seed/config.json:ro
    command:
      - sh
      - -c
      - |
        mkdir -p /state/config
        if [ ! -f /state/config/config.json ]; then
          cp /seed/config.json /state/config/config.json
        fi
        chmod 600 /state/config/config.json
        chown -R 1000:1000 /state

  filestash:
    image: machines/filestash:latest
    container_name: reon-s3-filestash
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      filestash-init:
        condition: service_completed_successfully
      swift:
        condition: service_healthy
    ports:
      - "8082:8334"
    environment:
      # В dev middleware-параметры (включая ключи S3) хранятся открыто.
      CONFIG_ENCRYPT: "false"
    volumes:
      - filestash-state:/app/data/state

  # OpenTelemetry Collector: общая точка приёма телеметрии.
  # OTLP gRPC — localhost:4317, OTLP HTTP — localhost:4318,
  # health_check — http://localhost:13133.
  # Экспортёр сейчас debug (вывод в лог), реальный backend добавляется
  # в docker/otel-collector/config.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: reon-s3-otel-collector
    restart: unless-stopped
    # root нужен, чтобы читать /var/lib/docker/containers для filelog.
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # json-file логи контейнеров Docker (на Docker Desktop — внутри VM демона).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

volumes:
  reon-postgres-data:
  swift-data:
  filestash-state:
