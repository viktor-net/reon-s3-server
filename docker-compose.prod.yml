# Production-подобный запуск в Docker: только API и Postgres.
#
# S3 уже работает на отдельной виртуалке и задаётся через S3_SERVICE_URL.
# Swift, Swagger UI, Filestash и OpenTelemetry Collector сюда не входят.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Проверка:
#   curl -i http://localhost:10007/health/live
#   curl -i http://localhost:10007/health/ready
#   curl -i http://localhost:10007/openapi/api.json
#
# Для локального стенда с S3 в контейнере используйте docker-compose.yml
# и docker-compose.api.yml, а не этот файл.
services:
  postgres:
    image: postgres:16-alpine
    container_name: reon-s3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reon}
      POSTGRES_USER: ${POSTGRES_USER:-reon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - reon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reon} -d ${POSTGRES_DB:-reon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Имя профиля из src/Reon.Api/Properties/PublishProfiles (без .pubxml).
        PUBLISH_PROFILE: ${API_PUBLISH_PROFILE:-}
    image: ${API_IMAGE:-reon-s3-api:local}
    container_name: reon-s3-api
    restart: unless-stopped
    init: true
    ports:
      - "${API_PORT:-10007}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Postgres внутри compose-сети: host = имя сервиса.
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-reon};Username=${POSTGRES_USER:-reon};Password=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}

      # Внешний S3 на виртуалке. Из контейнера адрес должен быть доступен.
      S3__ServiceUrl: "${S3_SERVICE_URL:?Задайте S3_SERVICE_URL в .env}"
      S3__AccessKey: "${S3_ACCESS_KEY:?Задайте S3_ACCESS_KEY в .env}"
      S3__SecretKey: "${S3_SECRET_KEY:?Задайте S3_SECRET_KEY в .env}"
      S3__Region: ${S3_REGION:-us-east-1}
      S3__BucketName: ${S3_BUCKET_NAME:-reon-files}
      S3__ForcePathStyle: "${S3_FORCE_PATH_STYLE:-true}"
      S3__EnsureBucket: "${S3_ENSURE_BUCKET:-true}"
      # Возможности провайдера. Для Swift s3api — значения ниже.
      S3__Capabilities__Versioning: "${S3_CAPABILITY_VERSIONING:-true}"
      S3__Capabilities__ObjectTags: "${S3_CAPABILITY_OBJECT_TAGS:-false}"
      S3__Capabilities__Lifecycle: "${S3_CAPABILITY_LIFECYCLE:-false}"
      S3__Capabilities__BucketPolicy: "${S3_CAPABILITY_BUCKET_POLICY:-false}"
      S3__Capabilities__ObjectLock: "${S3_CAPABILITY_OBJECT_LOCK:-false}"

      # Внешний адрес API для временных ссылок на скачивание.
      Admin__PublicBaseUrl: "${API_PUBLIC_BASE_URL:?Задайте API_PUBLIC_BASE_URL в .env}"
      # HMAC-секрет временных ссылок, минимум 32 символа.
      Admin__DownloadLinkSecret: "${DOWNLOAD_LINK_SECRET:?Задайте DOWNLOAD_LINK_SECRET в .env}"

      Database__AutoMigrate: ${DATABASE_AUTO_MIGRATE:-true}

      # Коллектор не нужен: OTel SDK не регистрируется.
      Observability__Enabled: "false"
      # В контейнере логи всегда JSON в stdout.
      Serilog__Console__Json: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  reon-postgres-data:
